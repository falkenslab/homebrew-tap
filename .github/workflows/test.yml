# Every cask, checked on a real Mac: Homebrew's style and audit, then installed from this tap the way
# a person would, its app's version read, and uninstalled.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  miyagi:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: This checkout as the falkenslab/tap tap
        run: |
          tap="$(brew --repository)/Library/Taps/falkenslab/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      # Recent Homebrew refuses casks from a tap the person hasn't trusted; older ones have no `trust`.
      - name: Trust the tap, as the README asks
        run: |
          if brew help trust >/dev/null 2>&1; then brew trust falkenslab/tap; else echo "no brew trust in this Homebrew"; fi
      - run: brew style --cask falkenslab/tap/miyagi
      - run: brew audit --cask --strict falkenslab/tap/miyagi
      - run: brew install --cask falkenslab/tap/miyagi
      - name: The app is installed, with the cask's version
        run: |
          expected=$(brew info --cask --json=v2 falkenslab/tap/miyagi | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')
          installed=$(defaults read /Applications/miyagi.app/Contents/Info.plist CFBundleShortVersionString)
          echo "cask $expected, app $installed"
          test "$installed" = "$expected"
          # What the caveats tell the person to run, if macOS won't open it.
          xattr -dr com.apple.quarantine /Applications/miyagi.app
          file /Applications/miyagi.app/Contents/MacOS/miyagi
      - run: brew uninstall --cask falkenslab/tap/miyagi
